<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#1a2744"/>
<meta name="description" content="ICON DocForge - Offline-first document and file conversion suite by ICON Studios"/>
<meta name="author" content="ICON Studios"/>
<title>ICON DocForge — Offline Document Converter</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="DocForge"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div id="app">
  <!-- HOME / DASHBOARD -->
  <div id="home-screen" class="screen active">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><div class="brand-mark">◆</div><span class="brand-name">ICON DocForge</span></div>
      </div>
    </header>
    <section class="hero">
      <h1>Document Conversion Studio</h1>
      <p class="hero-sub">Powerful offline conversion. Your files stay on your device.</p>
      <div class="privacy-badge">🔒 <span>Your files never leave your device</span></div>
    </section>
    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search-input" type="search" placeholder="Search conversions…" aria-label="Search"/>
    </div>
    <div id="category-filters" class="category-filters" role="tablist"></div>
    <main id="tools-grid" class="tools-grid" aria-live="polite"></main>
    <footer class="footer"><p>© 2026 ICON Studios · Yaoundé, Cameroon</p></footer>
  </div>

  <!-- TOOL SCREEN -->
  <div id="tool-screen" class="screen">
    <header class="topbar">
      <div class="topbar-inner">
        <button id="back-btn" class="btn-icon" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="tool-title-wrap"><span id="tool-icon" class="tool-icon-display"></span><span id="tool-title" class="tool-title-display"></span></div>
      </div>
    </header>
    <main id="tool-body" class="tool-body"></main>
  </div>

  <!-- DETAIL SCREEN -->
  <div id="detail-screen" class="screen">
    <header class="topbar">
      <div class="topbar-inner">
        <button id="detail-back" class="btn-icon" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg></button>
        <span id="detail-title" class="tool-title-display"></span>
      </div>
    </header>
    <main id="detail-body" class="tool-body"></main>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}
</script>
</body>
</html>
