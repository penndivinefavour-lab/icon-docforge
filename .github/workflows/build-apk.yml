name: Build ICON DocForge APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android dependencies
        working-directory: ./android-apk
        run: npm ci

      - name: Sync web assets to www
        run: |
          mkdir -p android-apk/www
          cp -r web/* android-apk/www/
          echo "Web assets synced:"
          ls -la android-apk/www/

      - name: Sync Capacitor
        working-directory: ./android-apk
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        working-directory: ./android-apk/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ./android-apk/android
        run: ./gradlew assembleDebug

      - name: Generate SHA-256 checksums
        run: |
          apk_path=$(find android-apk/android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -f "$apk_path" ]; then
            sha256sum "$apk_path" > "${apk_path}.sha256"
            echo "APK_PATH=$apk_path" >> $GITHUB_ENV
            echo "Generated checksum for: $(basename $apk_path)"
            ls -lh "$apk_path"
            cat "${apk_path}.sha256"
          else
            echo "ERROR: APK not found"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: icon-docforge-debug-apk
          path: ${{ env.APK_PATH }}

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: icon-docforge-checksum
          path: ${{ env.APK_PATH }}.sha256

      - name: Create GitHub Release (tagged only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          apk_path="${{ env.APK_PATH }}"
          sha_path="${apk_path}.sha256"
          version="${GITHUB_REF#refs/tags/}"
          gh release create "$version" \
            --title "ICON DocForge $version" \
            --notes "Production release of ICON DocForge offline document converter. All conversions run locally on your device." \
            "$apk_path" \
            "$sha_path"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
