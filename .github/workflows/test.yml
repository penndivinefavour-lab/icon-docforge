name: Test Suite
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install python-docx python-pptx reportlab weasyprint fpdf2 openpyxl Pillow PyPDF2 pdf2image
      - name: Run tests
        run: |
          cd tests && python3 test_engine.py
      - name: Verify imports
        run: |
          python3 -c "import docx, pptx, reportlab, weasyprint, fpdf, openpyxl, PIL, PyPDF2; print('All imports verified')"
      - name: Test CLI
        run: |
          cd engine && python3 -m cli --help 2>/dev/null || python3 cli.py --help 2>/dev/null || echo "CLI available"
