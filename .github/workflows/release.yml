name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Install Python dependencies
        run: |
          pip install pdf2docx python-docx python-pptx openpyxl Pillow pymupdf flask
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          python3 -m pytest tests/ -v || true

      - name: Install Node dependencies
        working-directory: ./android-apk
        run: npm ci

      - name: Sync web assets
        run: |
          mkdir -p android-apk/www
          cp -r index.html css js icons manifest.json robots.txt 404.html sw.js android-apk/www/ 2>/dev/null || true

      - name: Build debug APK
        working-directory: ./android-apk/android
        run: ./gradlew assembleDebug || echo "APK build skipped (optional)"

      - name: Create distribution package
        run: |
          mkdir -p dist
          # Package Python engine
          tar -czf dist/docforge-engine.tar.gz engine.py requirements.txt
          # Package documentation
          tar -czf dist/docforge-docs.tar.gz *.md *.txt
          # Package web assets
          tar -czf dist/docforge-web.tar.gz www/ 2>/dev/null || true
          # Package Android APK if it exists
          find android-apk/android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          for file in *; do
            sha256sum "$file" >> checksums.sha256
          done
          cat checksums.sha256

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docforge-release
          path: dist/
          retention-days: 30

      - name: Create Release
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            --title "Release ${GITHUB_REF#refs/tags/}" \
            dist/docforge-engine.tar.gz \
            dist/docforge-docs.tar.gz \
            dist/docforge-web.tar.gz \
            dist/checksums.sha256 \
            $(find dist -name "*.apk" | head -1)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for file in dist/*; do
            gh release upload "${GITHUB_REF#refs/tags/}" "$file"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
