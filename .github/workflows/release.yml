name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package all artifacts
        run: |
          mkdir -p dist
          cp -r web dist/web 2>/dev/null || true
          cp -r engine dist/engine 2>/dev/null || true
          cp -r tests dist/tests 2>/dev/null || true
          # Generate SHA-256 checksums
          cd dist && find . -type f -exec sha256sum {} \; > checksums.sha256
          cat checksums.sha256
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icon-docforge-release
          path: dist/
          retention-days: 30
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            --title "ICON DocForge $(echo ${GITHUB_REF#refs/tags/} | sed 's/^v//')" \
            dist/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
